<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Tarea entregable 2 - Header GathSession</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>

  <div class="container">

    <header class="main-header">
      <figure class="logo-container">
        <img src="img/gathsession.png" alt="Logotipo" srcset="img/gathsession@2x.png 2x">
      </figure>
      <nav>
        <ul class="nav-list">
          <li><a href="">Home</a></li>
          <li><a href="">Features</a></li>
          <li><a href="">Blog</a></li>
          <li><a href="">Contact</a></li>
          <li><a href="">About Us</a></li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <div>
        <h1>Build your best <br> community starting <br> from here. </h1>
        <p>Meet and communicate with the best people to run <br> projects, events or other activities in a more
          effective <br> and fun way</p>

        <div class="hero-buttons">
          <a href="">Get Started</a>
          <div class="Learn-more-button">
            <a href="">Learn More</a>
            <img src="img/arrow.svg" alt="arrow">
          </div>
        </div>
      </div>

      <section class="hero-image-box">
        <figure>
          <img src="img/content.png" alt="People" srcset="img/content@2x.png 2x">
        </figure>
      </section>
    </section>

    <section class="events">
      <div class="first-item">
        <img src="img/bd.svg" alt="Build Community">
        <span>Build <br> Community</span>
      </div>

      <div class="second-item">
        <img src="img/se.svg" alt="Share Events">
        <span>Share <br> Events</span>
      </div>

      <div class="third-item">
        <img src="img/gi.svg" alt="Get Information">
        <span>Get <br> Information</span>
      </div>
    </section>

  </div>
</body>

</html>
